# The check on GitHub (MILESTONES §4.3): `npm run check` and the e2e tests on macOS and Windows 11, for every push to
# main or dev and every pull request — the same gate as on the teacher's Mac, and the first run on Windows (N-06).
# Releases are the Release workflow's (a version tag), not this one's.
name: check
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MICROLAB_HIDDEN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: The Python 3.13 and Jedi MicroLab ships (checked by hash)
        run: npm run fetch:python
      - run: npm run check
        if: runner.os != 'Windows'
      # Windows: the same check without coverage — its 2-core runner runs the test files one at a time, and the coverage
      # gate is the Mac's (the same code)
      - run: npm run check:no-coverage
        if: runner.os == 'Windows'
      # Windows: a 1920 × 1080 screen for the e2e window — the runner's is smaller than MicroLab's (1280 × 720 at least,
      # the tests' 1440 × 900), and Windows keeps a shown window no bigger than its screen
      - name: A 1920 × 1080 screen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Format-Table Name, CurrentHorizontalResolution, CurrentVerticalResolution
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Format-Table Name, CurrentHorizontalResolution, CurrentVerticalResolution
      - run: npx playwright test
