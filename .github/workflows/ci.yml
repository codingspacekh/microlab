# Dormant until the repository is pushed (MILESTONES §4.3); `npm run check` is the gate locally.
name: check
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx playwright test
